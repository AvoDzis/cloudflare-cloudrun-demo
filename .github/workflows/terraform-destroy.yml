name: Terraform destroy

# Manual teardown of the main stack. Needs the typed confirmation and an
# approval on the "prod" environment. Data-disk snapshots are kept
# (KEEP_AUTO_SNAPSHOTS); the bootstrap stack is not touched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy prod" to confirm'
        required: true
        type: string

permissions: {}

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy (needs approval)
    if: inputs.confirm == 'destroy prod' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
      TF_VAR_deployer_service_account: ${{ vars.GCP_DEPLOY_SA }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_deletion_protection: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      # Deletion protection is a state-side flag: switch it off on just the two
      # protected resources before destroying
      - name: Turn off deletion protection
        run: >-
          terraform apply -auto-approve -lock-timeout=5m -no-color
          -target=module.cloud_run.google_cloud_run_v2_service.app
          -target=module.database_vm.google_compute_instance.postgres

      - run: terraform destroy -auto-approve -lock-timeout=5m -no-color
