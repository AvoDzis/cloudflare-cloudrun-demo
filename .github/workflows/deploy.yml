name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'resources/**'
      - 'skaffold.yaml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: write
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 500.0.0'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      # Note: Terraform is deployed manually, not via this workflow
      # Infrastructure changes should be reviewed and applied locally

      - name: Get Terraform Outputs
        id: terraform-outputs
        run: |
          cd terraform
          echo "vm_ip=$(terraform output -raw vm_internal_ip)" >> $GITHUB_OUTPUT
          echo "service_account=$(terraform output -raw cloud_run_service_account)" >> $GITHUB_OUTPUT

      - name: Update Cloud Run YAML with Terraform outputs
        run: |
          sed -i "s/REPLACE_WITH_VM_INTERNAL_IP/${{ steps.terraform-outputs.outputs.vm_ip }}/g" resources/prod/service.prod.yaml

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: app

      - name: Install Skaffold
        run: |
          curl -L -o skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x ./skaffold
          sudo mv ./skaffold /usr/local/bin/skaffold

      - name: Deploy Application
        run: |
          skaffold run -p prod

      - name: Get Cloud Run URL
        id: cloud-run-url
        run: |
          SERVICE_URL=$(gcloud run services describe prod-lab-app \
            --region=us-central1 \
            --format='value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Cloud Run Service URL: $SERVICE_URL"

      - name: Verify Deployment
        run: |
          # Wait for service to be ready
          sleep 30

          # Check if service is internal only (this should fail with 403)
          if curl -f -s "${{ steps.cloud-run-url.outputs.url }}/health" > /dev/null 2>&1; then
            echo "WARNING: Cloud Run service is publicly accessible!"
            exit 1
          else
            echo "✓ Cloud Run service is internal-only (as expected)"
          fi

          # Test via Load Balancer (if exists)
          if curl -f -s "https://health.api.avodzis.online/health" > /dev/null 2>&1; then
            echo "✓ Load Balancer health check passed"
          else
            echo "⚠ Load Balancer health check failed (may not be deployed yet)"
          fi

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Run Service**: prod-lab-app" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: us-central1" >> $GITHUB_STEP_SUMMARY
          echo "- **Internal URL**: ${{ steps.cloud-run-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Public URL**: https://api.avodzis.online" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: https://health.api.avodzis.online/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification Commands" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "curl https://api.avodzis.online/" >> $GITHUB_STEP_SUMMARY
          echo "curl https://health.api.avodzis.online/health" >> $GITHUB_STEP_SUMMARY
          echo "curl https://api.avodzis.online/api/quote" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
