name: Terraform plan

# Plan on pull requests (read-only identity) and keep one comment per root
# up to date on the PR. Pattern: https://developer.hashicorp.com/terraform/tutorials/automation/automate-terraform
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (${{ matrix.root }})
    # Skipped until the GCP variables are configured, and for forks (no OIDC token)
    if: vars.GCP_WIF_PROVIDER != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
      pull-requests: write # plan comment
    strategy:
      fail-fast: false
      matrix:
        include:
          - root: main
            dir: terraform
          - root: bootstrap
            dir: terraform/bootstrap
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # main stack
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
      TF_VAR_deployer_service_account: ${{ vars.GCP_DEPLOY_SA }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # bootstrap stack
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m -no-color -out=tfplan 2>&1 | tee plan.log
          exitcode=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes, 1 = error
          if [ "$exitcode" -eq 1 ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt

      - name: Comment on the PR
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROOT: ${{ matrix.root }}
          DIR: ${{ matrix.dir }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const { ROOT, DIR, EXITCODE } = process.env;
            const marker = `<!-- terraform-plan:${ROOT} -->`;
            const status = { '0': 'No changes', '1': 'Plan failed', '2': 'Changes to apply' }[EXITCODE];
            const file = EXITCODE === '1' ? `${DIR}/plan.log` : `${DIR}/plan.txt`;
            let output = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '(no output)';
            const max = 60000;
            if (output.length > max) output = output.slice(-max) + '\n... (truncated, see the job log)';
            const summary = (output.match(/^Plan: .*$/m) || [''])[0];
            const body = [
              marker,
              `### Terraform \`${ROOT}\`: ${status}`,
              summary && `**${summary}**`,
              `<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>`,
              `_Commit ${context.sha.slice(0, 7)}, run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].filter(Boolean).join('\n\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Job summary
        if: always() && steps.plan.outputs.exitcode != ''
        env:
          ROOT: ${{ matrix.root }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            echo "### Terraform $ROOT (exit code $EXITCODE)"
            echo '```'
            tail -c 60000 plan.txt 2>/dev/null || tail -c 60000 plan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
