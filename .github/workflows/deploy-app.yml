name: Deploy app

# Builds the image, pushes it to Artifact Registry tagged with the commit SHA
# and rolls it out with `gcloud run deploy --image`. Terraform owns every other
# setting of the service and ignores the image field, so this causes no drift.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-app-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, deploy
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'prod-quotes-app' }}
      IMAGE: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY || 'lab-repo' }}/quotes-app:${{ github.sha }}
      HEALTH_URL: ${{ vars.DOMAIN != '' && format('https://health.api.{0}/health', vars.DOMAIN) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Test
        working-directory: app
        run: |
          npm ci
          npm test

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" app
          docker push "$IMAGE"

      - name: Deploy
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet

      # The new revision only gets traffic after its startup probe (/health,
      # which queries Postgres) passes; this checks the public path end to end.
      - name: Smoke test
        if: env.HEALTH_URL != ''
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS --max-time 10 "$HEALTH_URL"; then exit 0; fi
            sleep 10
          done
          echo "::error::$HEALTH_URL did not return 200"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "- Image: \`$IMAGE\`"
            echo "- Roll back: \`gcloud run services update-traffic $SERVICE --region $REGION --to-revisions <previous-revision>=100\`"
          } >> "$GITHUB_STEP_SUMMARY"
