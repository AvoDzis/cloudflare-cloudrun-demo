name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    permissions:
      contents: 'read'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Init
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd terraform
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd terraform
          terraform plan -var-file=prod.tfvars

      - name: Install Node Dependencies
        run: |
          cd app
          npm ci

      - name: Install Skaffold
        run: |
          curl -L -o skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x ./skaffold
          sudo mv ./skaffold /usr/local/bin/skaffold

      - name: Skaffold Validate
        run: |
          skaffold validate

      - name: Validate Cloud Run YAML
        run: |
          for file in resources/prod/*.yaml; do
            echo "Validating $file"
            gcloud run services replace $file --dry-run --region=us-central1 || exit 1
          done

      - name: Build Docker Image (no push)
        run: |
          cd app
          docker build -t test-build:latest .

      - name: PR Validation Summary
        run: |
          echo "## PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Terraform format check passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Terraform validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Terraform plan succeeded" >> $GITHUB_STEP_SUMMARY
          echo "✅ Node.js dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Skaffold configuration valid" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cloud Run YAML valid" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker image builds successfully" >> $GITHUB_STEP_SUMMARY
