name: Terraform apply

# main stack only. The bootstrap stack manages CI's own identities and is
# applied locally by a project owner.
#
# 1. plan  : read-only identity, saves the plan file as an (encrypted) artifact
# 2. apply : waits for approval on the "prod" environment, then applies exactly
#            that saved plan with the apply identity
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "!terraform/bootstrap/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions: {}

# Never cancel a running apply; queue the next one instead
concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
  TF_VAR_deployer_service_account: ${{ vars.GCP_DEPLOY_SA }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    name: Plan
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m -no-color -out=tfplan 2>&1 | tee plan.log
          exitcode=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          if [ "$exitcode" -eq 1 ]; then exit 1; fi
          {
            echo "### Terraform plan (exit code $exitcode)"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A plan file embeds state values (some sensitive), and artifacts of a
      # public repository can be downloaded by any signed-in user, so it is
      # encrypted with a key that only lives in the repository secrets.
      - name: Encrypt plan
        if: steps.plan.outputs.exitcode == '2'
        env:
          TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          test -n "$TF_PLAN_ENCRYPTION_KEY" || { echo "::error::TF_PLAN_ENCRYPTION_KEY secret is not set"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:TF_PLAN_ENCRYPTION_KEY -in tfplan -out tfplan.enc
          rm tfplan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.exitcode == '2'
        with:
          name: tfplan-${{ github.sha }}
          path: terraform/tfplan.enc
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply (needs approval)
    needs: plan
    if: needs.plan.outputs.exitcode == '2'
    runs-on: ubuntu-latest
    environment: prod # required reviewers + main-only deployment branch policy
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ github.sha }}
          path: terraform

      - name: Decrypt plan
        env:
          TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:TF_PLAN_ENCRYPTION_KEY -in tfplan.enc -out tfplan

      # Applies exactly what was planned; fails if the state changed since
      - run: terraform apply -lock-timeout=5m -no-color tfplan
