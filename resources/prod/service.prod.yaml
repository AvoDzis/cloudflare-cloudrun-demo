apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: prod-lab-app
  annotations:
    run.googleapis.com/ingress: internal  # Internal ingress only - accessible via Load Balancer only
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
    spec:
      serviceAccountName: prod-cloud-run-sa  # From Terraform output: cloud_run_service_account
      containerConcurrency: 80
      containers:
        - image: IMAGE_PLACEHOLDER  # Replaced by Skaffold with actual image
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DB_HOST
              value: "10.0.1.2"  # Get from: terraform output -raw vm_internal_ip
            - name: DB_NAME
              value: "labdb"
            - name: DB_USER
              value: "labuser"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prod-db-password  # Secret Manager secret name
                  key: latest
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "prod"
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
      # VPC Direct Egress configuration
      vpcAccess:
        egress: PRIVATE_RANGES_ONLY
        networkInterfaces:
          - network: projects/test-project-402414/global/networks/prod-cloud-run-vpc
            subnetwork: projects/test-project-402414/regions/us-central1/subnetworks/prod-cloud-run-subnet
